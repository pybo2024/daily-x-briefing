name: US Market Pulse (Open / Intraday / Close)

on:
  workflow_dispatch:
    inputs:
      session:
        description: "Market session"
        type: choice
        options:
          - auto
          - open
          - intraday
          - close
        default: auto
      post_to_x:
        description: "Auto-post card & summary to X (Twitter)"
        type: boolean
        required: false
        default: true
  # Triggered on NYSE weekdays (09:40 / 13:00 / 16:10 America/New_York)
  # via external cron calling workflow_dispatch. Non-trading days are skipped automatically.

jobs:
  market-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Chinese fonts for clean rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies & Chromium
        run: |
          uv sync
          uv run playwright install chromium
          uv run playwright install-deps chromium

      - name: Fetch US market data, render card & post to X
        env:
          TZ: America/New_York
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          SESSION="${{ github.event.inputs.session || 'auto' }}"
          POST_FLAG=""
          if [ "${{ github.event.inputs.post_to_x }}" != "false" ]; then
            POST_FLAG="--post-to-x --skip-if-unconfigured"
          fi
          uv run python market_post.py --session "$SESSION" --skip-non-trading $POST_FLAG

      - name: Upload market card PNG artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-market-pulse-${{ github.run_number }}
          path: output/*_market.png
          retention-days: 14
