name: US Market Pulse (Open / Intraday / Close)

on:
  workflow_dispatch:
    inputs:
      session:
        description: "Market session"
        type: choice
        options:
          - auto
          - open
          - intraday
          - close
        default: auto
      post_to_x:
        description: "Auto-post card & summary to X (Twitter)"
        type: boolean
        required: false
        default: true
  # Triggered on NYSE weekdays; scripts skip US holidays automatically via --skip-non-trading.
  # Note: Cron uses UTC. Adjust +/- 1h if desired, or trigger externally via workflow_dispatch.
  schedule:
    # ~09:40 ET (EDT=13:40 UTC, EST=14:40 UTC) -> run at 14:40 UTC (or use external cron)
    - cron: "40 14 * * 1-5"
    # ~13:00 ET (EST=18:00 UTC)
    - cron: "0 18 * * 1-5"
    # ~16:10 ET (EST=21:10 UTC)
    - cron: "10 21 * * 1-5"

jobs:
  market-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Chinese fonts for clean rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies & Chromium
        run: |
          uv sync
          uv run playwright install chromium
          uv run playwright install-deps chromium

      - name: Fetch US market data, render card & post to X
        env:
          TZ: America/New_York
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          SESSION="${{ github.event.inputs.session || 'auto' }}"
          POST_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.post_to_x }}" = "true" ]; then
            POST_FLAG="--post-to-x --skip-if-unconfigured"
          fi
          uv run python market_post.py --session "$SESSION" --skip-non-trading $POST_FLAG

      - name: Upload market card PNG artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-market-pulse-${{ github.run_number }}
          path: output/*_market.png
          retention-days: 14
