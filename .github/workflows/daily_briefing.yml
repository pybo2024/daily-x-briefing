name: Daily X Briefing Video

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "edge-tts voice"
        required: false
        default: "zh-CN-XiaoxiaoNeural"
      rate:
        description: "Speech rate"
        required: false
        default: "+8%"
      post_to_x:
        description: "Auto-post video to X (Twitter)"
        type: boolean
        required: false
        default: true
  # Triggered daily at 07:17 Beijing Time via external cron calling workflow_dispatch

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Chinese fonts for clean rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies & Chromium
        run: |
          uv sync
          uv run playwright install chromium
          uv run playwright install-deps chromium

      - name: Generate today's 4:5 briefing video
        env:
          TZ: Asia/Shanghai
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GPT_SOVITS_API_URL: ${{ secrets.GPT_SOVITS_API_URL }}
          GPT_SOVITS_REF_AUDIO: ${{ secrets.GPT_SOVITS_REF_AUDIO }}
          GPT_SOVITS_PROMPT_TEXT: ${{ secrets.GPT_SOVITS_PROMPT_TEXT }}
          GPT_SOVITS_PROMPT_LANG: ${{ secrets.GPT_SOVITS_PROMPT_LANG }}
          GPT_SOVITS_TEXT_LANG: ${{ secrets.GPT_SOVITS_TEXT_LANG }}
          GPT_SOVITS_API_KEY: ${{ secrets.GPT_SOVITS_API_KEY }}
        run: |
          uv run python build_video.py --voice "${{ github.event.inputs.voice || 'zh-CN-XiaoxiaoNeural' }}" --rate "${{ github.event.inputs.rate || '+8%' }}"

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-x-briefing-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 14

      - name: Auto-post video to X (Twitter)
        if: github.event_name == 'schedule' || inputs.post_to_x == true
        env:
          TZ: Asia/Shanghai
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          uv run python post_to_x.py --skip-if-unconfigured
