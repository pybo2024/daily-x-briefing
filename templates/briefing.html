<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, initial-scale=1.0" />
<style>
  :root {
    --bg: #F5F0E6;
    --bg-dot: rgba(166, 58, 43, 0.06);
    --ink: #1E1B18;
    --muted: #6E655B;
    --accent: #A63A2B;
    --accent-soft: rgba(166, 58, 43, 0.10);
    --card: #FFFFFF;
    --border: #E5DDD0;
    --shadow: 0 10px 30px rgba(30, 27, 24, 0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1350px;
    background-color: var(--bg);
    background-image:
      radial-gradient(var(--bg-dot) 1.5px, transparent 1.5px),
      linear-gradient(to bottom, rgba(255,255,255,0.35), rgba(245,240,230,0.2));
    background-size: 24px 24px, 100% 100%;
    color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
    padding: 56px 60px 170px 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    position: relative;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--accent);
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--accent);
  }
  .top-bar .right-label {
    color: var(--muted);
    font-size: 20px;
    letter-spacing: 2px;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
    padding: 24px 0;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    align-self: flex-start;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid rgba(166, 58, 43, 0.25);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 22px;
    font-weight: 700;
  }

  h1.title {
    font-size: 52px;
    line-height: 1.22;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 25px;
    color: var(--muted);
    font-weight: 500;
  }

  /* Overview list */
  .overview-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 8px;
  }
  .overview-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px 26px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .overview-num {
    font-size: 30px;
    font-weight: 800;
    color: var(--accent);
    min-width: 48px;
  }
  .overview-body {
    flex: 1;
  }
  .overview-title {
    font-size: 27px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .overview-desc {
    font-size: 21px;
    color: var(--muted);
    line-height: 1.4;
  }

  /* Slide detail layout */
  .hero-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 8px solid var(--accent);
    border-radius: 22px;
    padding: 28px 30px;
    box-shadow: var(--shadow);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
  }
  .hero-left {
    flex: 1;
  }
  .hero-badge {
    font-size: 19px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .hero-title {
    font-size: 32px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .hero-sub {
    font-size: 22px;
    color: var(--muted);
    line-height: 1.45;
  }
  .hero-metric {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 22px;
    text-align: center;
    min-width: 170px;
  }
  .hero-metric-val {
    font-size: 30px;
    font-weight: 800;
    color: var(--accent);
  }
  .hero-metric-lbl {
    font-size: 17px;
    color: var(--muted);
    margin-top: 4px;
  }

  .detail-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .detail-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px 26px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: flex-start;
    gap: 18px;
  }
  .detail-label {
    background: var(--bg);
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 20px;
    font-weight: 700;
    white-space: nowrap;
    min-width: 124px;
    text-align: center;
  }
  .detail-text {
    font-size: 24px;
    line-height: 1.48;
    color: var(--ink);
    font-weight: 500;
  }

  .footer {
    border-top: 1px solid var(--border);
    padding-top: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
    color: var(--muted);
  }

  .hidden-stage {
    opacity: 0;
    transform: translateY(14px);
  }
</style>
</head>
<body>
  <div class="top-bar">
    <span id="top-left">X AI · 美股早报</span>
    <span class="right-label" id="top-right">HEADLINES</span>
  </div>

  <div class="main" id="main-content"></div>

  <div class="footer">
    <span id="footer-source">信源：公开财经与科技媒体</span>
    <span id="footer-page">00 / 05</span>
  </div>
</body>
</html>
